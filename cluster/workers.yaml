---
# Worker ProxmoxMachineTemplate
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxMachineTemplate
metadata:
  name: homelab-cluster-worker
  namespace: default
spec:
  template:
    spec:
      sourceNode: ryzen
      templateID: 9000
      format: qcow2
      full: true
      numSockets: 1
      numCores: 4
      memoryMiB: 4096
      disks:
        bootVolume:
          disk: scsi0
          sizeGb: 50
      network:
        default:
          bridge: vmbr0
          model: virtio
      checks:
        skipCloudInitStatus: true
      metadataSettings:
        providerIDInjection: true
---
apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
kind: TalosConfigTemplate
metadata:
  name: homelab-cluster-worker
  namespace: default
spec:
  template:
    spec:
      generateType: worker
      talosVersion: v1.9
      configPatches:
        - op: replace
          path: /machine/install
          value:
            disk: /dev/sda
        - op: add
          path: /machine/kubelet/extraArgs
          value:
            cloud-provider: external
            rotate-server-certificates: "true"
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: homelab-cluster-workers
  namespace: default
  labels:
    cluster.x-k8s.io/cluster-name: homelab-cluster
spec:
  clusterName: homelab-cluster
  replicas: 2
  selector:
    matchLabels: null
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: homelab-cluster
        node-role.kubernetes.io/node: ""
    spec:
      clusterName: homelab-cluster
      version: v1.32.0
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          kind: TalosConfigTemplate
          name: homelab-cluster-worker
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: ProxmoxMachineTemplate
        name: homelab-cluster-worker
