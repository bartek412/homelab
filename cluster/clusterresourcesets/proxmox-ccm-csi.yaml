---
# ClusterResourceSet: Applies Proxmox CCM/CSI credential secrets to the workload
# cluster automatically. The actual Helm releases are installed by bootstrap.sh.
#
# NOTE: Before applying, run bootstrap.sh --generate-secrets to create the
# proxmox-crs-secrets ConfigMap with your actual Proxmox credentials.
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: proxmox-credentials
  namespace: default
spec:
  clusterSelector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: homelab-cluster
  strategy: ApplyOnce
  resources:
    - kind: Secret
      name: proxmox-crs-credentials
