---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: homelab-cluster
  namespace: default
  labels:
    cluster.x-k8s.io/cluster-name: homelab-cluster
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/12
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: TalosControlPlane
    name: homelab-cluster-cp
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: ProxmoxCluster
    name: homelab-cluster
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: ProxmoxCluster
metadata:
  name: homelab-cluster
  namespace: default
  labels:
    cluster.x-k8s.io/cluster-name: homelab-cluster
spec:
  credentialsRef:
    name: homelab-cluster-proxmox-credentials
  # Override CAPMOX memory scheduler — existing VMs on the node make it think
  # memory is exhausted. This adds 64GB to the "available" calculation,
  # effectively letting Proxmox handle overcommit natively.
  schedulerHints:
    memoryAdjustment: 68719476736
  # VIP that floats between control plane nodes
  controlPlaneEndpoint:
    host: 10.9.0.210
    port: 6443
  ipv4Config:
    addresses:
      - 10.9.0.211-10.9.0.215
    prefix: 24
    gateway: 10.9.0.1
  dnsServers:
    - 10.9.0.1
  allowedNodes:
    - ryzen
