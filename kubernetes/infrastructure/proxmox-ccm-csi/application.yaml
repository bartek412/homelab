apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proxmox-ccm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: ghcr.io/sergelogvinov
      chart: proxmox-cloud-controller-manager
      targetRevision: "*"
      helm:
        valueFiles:
          - $values/kubernetes/infrastructure/proxmox-ccm-csi/values-ccm.yaml

    - repoURL: https://github.com/bartek412/homelab.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proxmox-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: ghcr.io/sergelogvinov
      chart: proxmox-csi-plugin
      targetRevision: "*"
      helm:
        valueFiles:
          - $values/kubernetes/infrastructure/proxmox-ccm-csi/values-csi.yaml

    - repoURL: https://github.com/bartek412/homelab.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
