deployment:
  replicas: 1

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik-internal

ingressRoute:
  dashboard:
    enabled: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-internal

ports:
  web:
    port: 8000
    exposedPort: 80
    expose:
      default: true
    redirections:
      entryPoint:
        to: websecure
        scheme: https
  websecure:
    port: 8443
    exposedPort: 443
    expose:
      default: true

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: "10.9.0.230"

additionalArguments:
  - "--serversTransport.insecureSkipVerify=true"
