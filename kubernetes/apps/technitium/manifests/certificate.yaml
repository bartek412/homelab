apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: technitium-tls
  namespace: technitium
  annotations:
    avp.kubernetes.io/path: "secret/data/kubernetes/config"
spec:
  secretName: technitium-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - dns.<domain>
