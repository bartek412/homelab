apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkwarden-tls
  namespace: linkwarden
  annotations:
    avp.kubernetes.io/path: "secret/data/kubernetes/config"
spec:
  secretName: linkwarden-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - links.local.<domain>
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkwarden-external-tls
  namespace: linkwarden
  annotations:
    avp.kubernetes.io/path: "secret/data/kubernetes/config"
spec:
  secretName: linkwarden-external-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - links.<domain>
