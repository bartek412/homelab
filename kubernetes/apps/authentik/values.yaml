# Authentik Helm Values
# Documentation: https://docs.goauthentik.io/
# Secrets are pulled from Vault via External Secrets Operator
# PostgreSQL provided by CloudNativePG operator

authentik:
  secret_key: ""  # Loaded from authentik-secrets via AUTHENTIK_SECRET_KEY env
  error_reporting:
    enabled: false
  postgresql:
    host: authentik-postgres-rw
    name: authentik
    user: authentik
    password: ""  # Loaded via AUTHENTIK_POSTGRESQL__PASSWORD env

server:
  replicas: 1
  ingress:
    enabled: false  # Using Traefik IngressRoute instead
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: secret-key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-postgres-credentials
          key: password

worker:
  replicas: 1
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: secret-key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-postgres-credentials
          key: password

postgresql:
  enabled: false

redis:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/redis
    tag: 7.4.0
  master:
    persistence:
      storageClass: proxmox
      size: 2Gi
