apiVersion: v1
kind: Service
metadata:
  name: hydra
  namespace: external-services
spec:
  type: ExternalName
  externalName: 10.9.0.50
  ports:
    - name: http
      port: 5076
      targetPort: 5076
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hydra-tls
  namespace: external-services
  annotations:
    avp.kubernetes.io/path: "secret/data/kubernetes/config"
spec:
  secretName: hydra-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - hydra.<domain>
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hydra
  namespace: external-services
  annotations:
    avp.kubernetes.io/path: "secret/data/kubernetes/config"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hydra.<domain>`)
      kind: Rule
      services:
        - name: hydra
          port: 5076
  tls:
    secretName: hydra-tls
