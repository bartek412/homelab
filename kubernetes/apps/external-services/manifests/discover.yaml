apiVersion: v1
kind: Service
metadata:
  name: discover
  namespace: external-services
spec:
  type: ExternalName
  externalName: 10.9.0.50
  ports:
    - name: http
      port: 5055
      targetPort: 5055
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: discover-tls
  namespace: external-services
  annotations:
    avp.kubernetes.io/path: "secret/data/kubernetes/config"
spec:
  secretName: discover-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - discover.<domain>
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: discover
  namespace: external-services
  annotations:
    avp.kubernetes.io/path: "secret/data/kubernetes/config"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`discover.<domain>`)
      kind: Rule
      services:
        - name: discover
          port: 5055
  tls:
    secretName: discover-tls
