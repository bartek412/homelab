apiVersion: v1
kind: Service
metadata:
  name: sync
  namespace: external-services
spec:
  type: ExternalName
  externalName: 10.9.0.50
  ports:
    - name: http
      port: 8384
      targetPort: 8384
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sync-tls
  namespace: external-services
  annotations:
    avp.kubernetes.io/path: "secret/data/kubernetes/config"
spec:
  secretName: sync-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - sync.<domain>
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sync
  namespace: external-services
  annotations:
    avp.kubernetes.io/path: "secret/data/kubernetes/config"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sync.<domain>`)
      kind: Rule
      services:
        - name: sync
          port: 8384
  tls:
    secretName: sync-tls
